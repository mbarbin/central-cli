{% extends "base.html" %}

{% block title %}{{ config.title }}{% endblock title %}

{% block wrapper_class %} no-sidebar{% endblock wrapper_class %}

{% block content %}
<section class="hero">
  <h1>{{ section.title }}</h1>

  <p class="badges">
    <a href="https://github.com/mbarbin/central-cli/actions/workflows/ci.yml"><img src="https://github.com/mbarbin/central-cli/workflows/ci/badge.svg" alt="CI Status"></a>
    <a href="https://github.com/mbarbin/central-cli/actions/workflows/deploy-doc.yml"><img src="https://github.com/mbarbin/central-cli/workflows/deploy-doc/badge.svg" alt="Deploy Doc Status"></a>
  </p>

  <div class="intro">
    {{ section.content | safe }}
  </div>
</section>

<section>
  <h2>Latest Additions</h2>
  <ul>
    <li>
      <a href="book/introduction-to-central-cli/">Introduction to central</a>
    </li>
  </ul>
</section>
{% endblock content %}
